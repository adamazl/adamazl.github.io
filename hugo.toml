baseURL = "https://adamazl.github.io/homelab/"
languageCode = "en-us"
title = "The Home Lab"
paginate = 10

enableRobotsTXT = true
enableGitInfo = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  description = "Adventures in homelabbing, self-hosting, and home networking."
  author = "Adam Aizal"
  avatarUrl = "images/avatar.png"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/adamazl"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = true
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"
    tabWidth = 2

[sitemap]
  changefreq = "weekly"
  priority = 0.5
