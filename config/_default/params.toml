colorScheme = "congo"   # built-in: congo, avocado, ocean, fire, slate, violet, rose, pink
defaultAppearance = "dark"
autoSwitchAppearance = true
enableSearch = true

description = "Adventures in homelabbing, self-hosting, and home networking."
images = ["images/avatar.png"]

[homepage]
  layout = "profile"     # profile page with avatar + bio
  homepageImage = "images/avatar.png"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/posts"
  cardView = true
  showSummary = true

[author]
  name = "Adam Aizal"
  image = "images/avatar.png"
  headline = "Homelab enthusiast"
  bio = "Building and breaking things in my homelab — networking, self-hosting, and everything in between."
  links = [
    { github = "https://github.com/adamazl" },
    { rss = "/index.xml" },
  ]

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showReadingTime = true
  showWordCount = true
  showTableOfContents = true
  showTaxonomies = true
  showEdit = false
  seriesOpened = true

[list]
  showCards = true
  showBreadcrumbs = true
  groupByYear = false
  cardView = true
  showSummary = true

[taxonomy]
  showTermCount = true
  cardView = true

[sitemap]
  excludedKinds = []
