baseURL = "https://adamazl.github.io/"
languageCode = "en-us"
title = "The Home Lab"
theme = "congo"
paginate = 10

enableRobotsTXT = true
enableGitInfo = true    # use Git commit timestamps for lastmod in sitemap
buildDrafts = false
buildFuture = false
buildExpired = false

# Required for search
[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
