<footer class="mt-20 border-t border-slate-800/70">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-8">
    <p class="text-sm text-slate-500">
      © {{ now.Year }} {{ site.Params.author | default site.Title }}
    </p>
    <div class="flex items-center gap-5">
      {{ range site.Params.social }}
      <a href="{{ .url }}"
         target="_blank" rel="noopener noreferrer"
         aria-label="{{ .name }}"
         class="text-sm text-slate-500 transition-colors hover:text-slate-300">
        {{ .name }}
      </a>
      {{ end }}
      <a href="{{ site.Home.RelPermalink }}index.xml"
         class="text-sm text-slate-500 transition-colors hover:text-slate-300">
        RSS
      </a>
    </div>
  </div>
</footer>
