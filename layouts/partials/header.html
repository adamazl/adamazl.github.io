<header class="sticky top-0 z-50 border-b border-slate-800/70 bg-slate-950/80 backdrop-blur-md">
  <nav aria-label="Main navigation" class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

    <a href="{{ site.Home.RelPermalink }}"
       class="flex items-center gap-2 text-base font-bold tracking-tight text-white transition-colors hover:text-accent-400">
      <span class="text-accent-400">&gt;_</span>
      {{ site.Title }}
    </a>

    <div class="flex items-center gap-1">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"
         class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors
                {{ if $.IsMenuCurrent "main" . }}text-accent-400 bg-slate-800{{ else }}text-slate-400 hover:bg-slate-800/70 hover:text-slate-100{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}

      <!-- Search button -->
      <button id="search-btn"
              aria-label="Search"
              class="ml-1 flex items-center gap-2 rounded-md border border-slate-700/60 bg-slate-800/40 px-3 py-1.5 text-sm text-slate-400 transition-all hover:border-accent-500/40 hover:text-slate-300">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span class="hidden sm:inline text-xs">Search</span>
        <kbd class="hidden sm:inline rounded border border-slate-700 bg-slate-800 px-1.5 py-0.5 text-[10px] text-slate-500">⌘K</kbd>
      </button>

      <!-- Theme toggle -->
      <button id="theme-toggle"
              aria-label="Toggle theme"
              class="ml-1 rounded-md p-2 text-slate-400 transition-colors hover:bg-slate-800/70 hover:text-slate-200">
        <!-- Sun icon (shown in dark mode) -->
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

  </nav>
</header>

<!-- Search modal -->
<div id="search-modal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-box">
    <div class="search-input-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="search" placeholder="Search posts…" autocomplete="off" spellcheck="false">
      <kbd class="hidden sm:inline rounded border border-slate-700 bg-slate-800 px-1.5 py-0.5 text-[10px] text-slate-500">Esc</kbd>
    </div>
    <div id="search-results" class="max-h-72 overflow-y-auto"></div>
    <div class="px-4 py-2 text-[11px] text-slate-600">
      Powered by Fuse.js · <span class="text-slate-500">{{ len (where .Site.RegularPages "Section" "posts") }} posts indexed</span>
    </div>
  </div>
</div>
