<header class="sticky top-0 z-50 border-b border-slate-800/70 bg-slate-950/80 backdrop-blur-md">
  <nav aria-label="Main navigation" class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

    <a href="{{ site.Home.RelPermalink }}"
       class="flex items-center gap-2 text-base font-bold tracking-tight text-white transition-colors hover:text-accent-400">
      <span class="text-accent-400">&gt;_</span>
      {{ site.Title }}
    </a>

    <div class="flex items-center gap-1">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"
         class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors
                {{ if $.IsMenuCurrent "main" . }}text-accent-400 bg-slate-800{{ else }}text-slate-400 hover:bg-slate-800/70 hover:text-slate-100{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
      <button id="theme-toggle" aria-label="Toggle theme"
              class="ml-2 rounded-md p-1.5 text-slate-400 transition-colors hover:bg-slate-800/70 hover:text-slate-100">
        <svg id="theme-icon-dark" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg id="theme-icon-light" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>

  </nav>
</header>
